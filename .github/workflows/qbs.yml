name: qbs
# Typechecks qbs (Agda 2.7.0.1, standard-library v2.3, agda-categories c2e7c13e): strict, i.e. every module
# must produce no Agda output, and there are no postulates or unsolved holes (`make check`).
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: wenkokke/setup-agda@v2
        with:
          agda-version: 2.7.0.1
      - name: libraries
        run: |
          git clone --depth 1 --branch v2.3 https://github.com/agda/agda-stdlib "$HOME/agda-stdlib"
          git clone https://github.com/agda/agda-categories "$HOME/agda-categories"
          git -C "$HOME/agda-categories" checkout c2e7c13e
          # agda-categories at this commit asks for standard-library-2.1; v2.3 is what we use
          sed -i 's/standard-library-2\.1/standard-library-2.3/' "$HOME/agda-categories/agda-categories.agda-lib"
          mkdir -p "$HOME/.agda"
          echo "$HOME/agda-stdlib/standard-library.agda-lib" >  "$HOME/.agda/libraries"
          echo "$HOME/agda-categories/agda-categories.agda-lib" >> "$HOME/.agda/libraries"
      - run: make check
      - name: show failing logs
        if: failure()
        run: |
          agda --version | head -1
          for f in $(find _build/logs -name '*.log' -size +0 | sort | head -3); do
            msg=$(head -c 1500 "$f" | python3 -c "import sys,urllib.parse;print(sys.stdin.read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
            echo "::error title=$f::$msg"
          done
